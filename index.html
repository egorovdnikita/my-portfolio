<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Егоров Никита</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Тема ставится до отрисовки, чтобы не было вспышки светлого фона
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        // Постер видео-портрета — первая картинка на экране: грузим сразу, не дожидаясь скрипта сайта.
        // Имя файла совпадает с profile.poster в src/content.ts
        var l = document.createElement('link');
        l.rel = 'preload';
        l.as = 'image';
        l.href = '/assets/hero-poster-' + t + '-v9.jpg';
        document.head.appendChild(l);
      })();
    </script>
    <meta name="description" content="Senior Product Designer / Продуктовый дизайнер (Design Systems)" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://egorovdnikita.ru/" />
    <meta property="og:title" content="Егоров Никита" />
    <meta property="og:description" content="Senior Product Designer / Продуктовый дизайнер (Design Systems)" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Егоров Никита" />
    <meta name="twitter:description" content="Senior Product Designer / Продуктовый дизайнер (Design Systems)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
