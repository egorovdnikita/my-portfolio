<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Егоров Никита</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- Цвет шапки браузера (Safari, Telegram) — как фон страницы; ставят скрипт ниже и useTheme -->
    <meta name="theme-color" content="#000000" />
    <script>
      // Тема ставится до отрисовки, чтобы не было вспышки светлого фона
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'dark' ? '#000000' : '#f5f5f5');
      })();
    </script>
    <meta name="description" content="Продуктовый дизайнер" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://egorovdnikita.ru/" />
    <meta property="og:title" content="Егоров Никита" />
    <meta property="og:description" content="Продуктовый дизайнер" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Егоров Никита" />
    <meta name="twitter:description" content="Продуктовый дизайнер" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
