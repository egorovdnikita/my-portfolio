<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Егоров Никита | Product Designer</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      // Тема ставится до отрисовки, чтобы не было вспышки светлого фона
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <meta name="description" content="Портфолио продуктового дизайнера Никиты Егорова" />
    <link rel="preload" href="./fonts/Iosevka-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/Iosevka-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Тест шрифта: Inter с межбуквенным −4% (Iosevka остаётся подключённым для отката) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
