# Бот вопросов к кейсам: отдаёт готовые ответы из kb/, ничего не генерирует. Только бесплатный тариф.
name = "case-chat"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "case_chat_log"
database_id = "f261848b-d30f-4479-9868-1abeab392d1b"

# Понедельник, 10:00 по Москве — сводка в Telegram и очистка журнала старше 90 дней
[triggers]
crons = ["0 7 * * 1"]

[vars]
# Откуда разрешено спрашивать
ALLOWED_ORIGINS = "https://egorovdnikita.ru,http://localhost:5180,http://localhost:5173"

# Секреты TG_BOT_TOKEN и TG_CHAT_ID задаются через `npx wrangler secret put`, не в репозитории
